function list(){let items=filtered();let forms='<div class="filter-panel"><div class="filter-grid"><input id="f-term" class="formcontrol" placeholder="搜索题目、答案关键词…" value="'+esc(filter.term)+'"/><select id="f-level" class="formcontrol"><option value="">全部冲刺优先级</option>'+['P1','P2','P3'].map(x=>'<option value="'+x+'" '+(filter.level===x?'selected':'')+'>'+x+' · '+({P1:'必须背',P2:'重点/真题',P3:'其余补背'}[x])+'</option>').join('')+'</select><select id="f-area" class="formcontrol"><option value="">全部篇章</option>'+HALLS.map(h=>'<option value="'+h.lo+'-'+h.hi+'" '+(filter.area===h.lo+'-'+h.hi?'selected':'')+'>'+h.name+'</option>').join('')+'</select><select id="f-chapter" class="formcontrol"><option value="">全部章节</option>'+Object.entries(CH).map(([c,name])=>'<option value="'+c+'" '+(filter.chapter===c?'selected':'')+'>'+c+' · '+esc(name)+'</option>').join('')+'</select><select id="f-status" class="formcontrol"><option value="">全部掌握状态</option><option value="unseen" '+(filter.status==='unseen'?'selected':'')+'>只看未标记</option><option value="again" '+(filter.status==='again'?'selected':'')+'>不会 / 模糊重练</option><option value="todo" '+(filter.status==='todo'?'selected':'')+'>未会背</option><option value="exam" '+(filter.status==='exam'?'selected':'')+'>原PDF有真题标注</option></select><select id="f-order" class="formcontrol"><option value="priority" '+(filter.order==='priority'?'selected':'')+'>优先级排序</option><option value="chapter" '+(filter.order==='chapter'?'selected':'')+'>原书章节顺序</option></select></div><div class="quick"><small>快速筛选</small><button class="btn small soft" data-quick="important">优先 P1＋P2</button><button class="btn small" data-quick="ability">能力篇11～17章</button><button class="btn small" data-quick="exam">原书标注真题</button><button class="btn small" data-quick="todo">只看未会背</button><button class="btn small" data-quick="reset">清除筛选</button></div></div>';
return sectionTitle('只背押题专题没有的部分','共 177 道理论原题')+forms+'<div class="listbar"><div class="meta">筛选结果 <b>'+items.length+'</b> / 177 题 · 点击标题展开答案</div><div class="buttons"><button class="btn small" data-expand="all">全部展开</button><button class="btn small" data-expand="none">全部收起</button><button class="btn small" data-view="quiz">进入抽背</button></div></div>'+ (items.length?'<div class="item-list">'+items.map(card).join('')+'</div>':'<div class="empty">没有符合当前条件的题目。<br>换一个筛选条件再试。</div>')}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){let rows=GAPS.filter(x=>quiz.mode==='important'?primary(x):quiz.mode==='wrong'?(marks[x.id]==='again'||marks[x.id]==='unclear'):quiz.mode==='unseen'?!marks[x.id]:true).slice();rows.sort((a,b)=>a.priority.localeCompare(b.priority)||a.c-b.c||a.n-b.n);if(quiz.random)shuffle(rows);quiz.deck=rows.map(x=>x.id);quiz.pos=0;quiz.shown=false}
function quizPage(){if(!quiz.deck.length)buildDeck();const q=BYID[quiz.deck[quiz.pos]];
let head='<div class="quizhead"><div class="btnrow"><div><b>抽背模式</b><div class="tiny">每题先尝试默写，再展开答案核对</div></div><button class="btn small" data-quiz-refresh="yes">重新组卷 ↻</button></div><div class="buttons" style="margin-top:12px"><select id="quizMode" class="formcontrol" style="max-width:230px"><option value="important" '+(quiz.mode==='important'?'selected':'')+'>优先 P1＋P2（35题）</option><option value="all" '+(quiz.mode==='all'?'selected':'')+'>全部补背（177题）</option><option value="wrong" '+(quiz.mode==='wrong'?'selected':'')+'>只练不会／模糊</option><option value="unseen" '+(quiz.mode==='unseen'?'selected':'')+'>只练未标记</option></select><label style="font-size:12px;color:#637f8f"><input id="quizRandom" type="checkbox" '+(quiz.random?'checked':'')+'> 随机顺序</label></div></div>';
if(!q)return '<div class="quizwrap">'+sectionTitle('随机抽背','题卡训练')+head+'<div class="empty">当前模式没有可练习的题。<br>换个模式，或回到题库标记不会题。</div></div>';
return '<div class="quizwrap">'+sectionTitle('随机抽背','空格揭晓 · 1不会 · 2模糊 · 3会背 · Enter下一题')+head+'<div class="quizquestion"><div class="btnrow"><span style="font-size:12px;color:#b0d8d6">第 '+(quiz.pos+1)+' / '+quiz.deck.length+' 题 · 第'+q.c+'章 '+esc(q.cn)+'</span><span>'+markTag(q.priority)+labelType(q)+'</span></div><h2>'+esc(q.title)+'</h2><small>300条原题号：第'+q.c+'章 · Q'+q.n+' · PDF第'+q.page+'页</small></div><div class="quizanswer">'+(quiz.shown?blockAnswer(q)+tips(q):'<div class="hiddenans"><span style="font-size:28px">◉</span><span>先在心里默写答案要点，再点击“揭晓答案”</span></div>')+'</div><div class="quizactions">'+(quiz.shown?'<button class="btn warn" data-quiz-mark="again">1 · 不会</button><button class="btn" data-quiz-mark="unclear">2 · 模糊</button><button class="btn soft" data-quiz-mark="mastered">3 · 会背 ✓</button>':'<button class="btn primary" data-quiz-reveal="yes">揭晓答案（空格）</button>')+'</div><div class="btnrow"><button class="btn" data-quiz-step="-1" '+(quiz.pos===0?'disabled':'')+'>← 上一题</button><span class="tiny">'+(marks[q.id]?'当前标记：'+({again:'不会',unclear:'模糊',mastered:'会背'}[marks[q.id]]):'尚未标记')+'</span><button class="btn primary" data-quiz-step="1">下一题 →</button></div></div>'}
function render(){const m=document.getElementById('main');m.innerHTML=view==='home'?home():view==='list'?list():quizPage();nav()}
function pushMark(id,v){marks[id]=v;save();const preservedY=window.scrollY;if(view==='list'){render();window.scrollTo({top:preservedY,behavior:'instant'})}else if(view==='quiz'){render()}}
document.getElementById('menu').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('button,[data-toggle]');if(!b)return;
if(b.dataset.view){setView(b.dataset.view);return}
if(b.dataset.goFilter){filter={term:'',level:b.dataset.goFilter,area:'',chapter:'',status:'',order:'priority'};opened.clear();setView('list');return}
if(b.dataset.chapter){filter={term:'',level:'',area:'',chapter:b.dataset.chapter,status:'',order:'chapter'};opened.clear();setView('list');return}
if(b.dataset.quick){switch(b.dataset.quick){case 'important':filter.level='';filter.status='';filter.area='';filter.chapter='';filter.term='';filter._special='important';break;case 'ability':filter.area='11-17';filter.chapter='';filter.level='';filter._special='';break;case 'exam':filter.status='exam';filter._special='';break;case 'todo':filter.status='todo';filter._special='';break;default:filter={term:'',level:'',area:'',chapter:'',status:'',order:'priority'};}opened.clear();render();return}
if(b.dataset.expand){if(b.dataset.expand==='all')for(const x of filtered())opened.add(x.id);else opened.clear();render();return}
if(b.dataset.toggle){if(opened.has(b.dataset.toggle))opened.delete(b.dataset.toggle);else opened.add(b.dataset.toggle);let p=b.closest('.qcard');p.classList.toggle('open');return}
if(b.dataset.status){pushMark(b.dataset.id,b.dataset.status);return}
if(b.dataset.quizReveal){quiz.shown=true;render();return}
if(b.dataset.quizMark){marks[quiz.deck[quiz.pos]]=b.dataset.quizMark;save();render();return}
if(b.dataset.quizStep){quiz.pos=Math.max(0,Math.min(quiz.deck.length-1,quiz.pos+Number(b.dataset.quizStep)));quiz.shown=false;render();return}
if(b.dataset.quizRefresh){buildDeck();render();return}
});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='f-term'){filter.term=e.target.value;let pos=e.target.selectionStart;let el=document.activeElement;let listBox=document.querySelector('.item-list');if(listBox){let rows=filtered();listBox.innerHTML=rows.map(card).join('')||'<div class="empty">没有符合的题目</div>';let n=document.querySelector('.listbar .meta b');if(n)n.textContent=rows.length;} }});
document.getElementById('main').addEventListener('change',e=>{const t=e.target;const key=({'f-level':'level','f-area':'area','f-chapter':'chapter','f-status':'status','f-order':'order'})[t.id];if(key){filter[key]=t.value;filter._special='';if(key==='area')filter.chapter='';opened.clear();render();return}if(t.id==='quizMode'){quiz.mode=t.value;buildDeck();render();return}if(t.id==='quizRandom'){quiz.random=t.checked;buildDeck();render();return}});
document.addEventListener('keydown',e=>{if(view!=='quiz')return;if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName||''))return;const k=e.key;if(k===' '){e.preventDefault();quiz.shown=!quiz.shown;render()}if(k==='Enter'){e.preventDefault();quiz.pos=Math.min(quiz.deck.length-1,quiz.pos+1);quiz.shown=false;render()}if(quiz.shown&&['1','2','3'].includes(k)){marks[quiz.deck[quiz.pos]]={1:'again',2:'unclear',3:'mastered'}[k];save();render()}});
// Dedicated "only P1+P2" fast filter, without altering source teacher priority.
const oldFiltered=filtered;filtered=function(){let rows=oldFiltered();return filter._special==='important'?rows.filter(primary):rows};
render();
</script></body></html>
