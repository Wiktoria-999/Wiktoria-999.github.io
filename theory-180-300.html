/* Detailed study knowledge tree; designed to coexist with the original trainer. */
.tree-intro{max-width:950px;margin:-11px 0 22px;color:#737d90;line-height:1.85}
.tree-fieldbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:4px 0 20px}
.tree-field{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid #e5e8f2;background:#fff;border-radius:14px;padding:16px 16px 14px;color:var(--ink);box-shadow:0 3px 14px rgba(26,32,65,.02)}
.tree-field:hover,.tree-field.active{border-color:#a8a6f0;background:#f9f8ff}
.tree-field .caption{font-size:11px;font-weight:850;color:#605ce6;letter-spacing:.1em}
.tree-field .field-head{font-size:14px;font-weight:800;line-height:1.4}
.tree-field .field-count{font-size:11px;color:#8791a3;line-height:1.6}
.tree-field .field-line{width:100%;height:4px;border-radius:5px;background:#e9e9fa;overflow:hidden;margin-top:auto}
.tree-field .field-line span{display:block;height:100%;background:#605ce6}
.tree-actions{display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px;padding:14px 17px;margin-bottom:16px}
.tree-actions .field{flex:0 0 auto;min-width:140px}
.tree-actions .field-tree-search{flex:1 1 230px;min-width:180px}
.tree-actions .field-tree-search input{width:100%;padding:10px 12px;border:1px solid #e0e3ee;border-radius:9px;background:#fbfcff;outline:none}
.tree-actions .field-tree-search input:focus{border-color:#7774e5;box-shadow:0 0 0 3px #eaeaff}
.tree-button-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tree-facts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#8791a3;margin:2px 0 17px}
.tree-facts b{font-weight:800;color:#4c4bb0}
.tree-workspace{display:grid;grid-template-columns:minmax(340px,0.95fr) minmax(0,1.15fr);gap:17px;align-items:start}
.tree-outline{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);position:sticky;top:18px}
.tree-outline-title{padding:15px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tree-outline-title strong{font-size:14px}.tree-outline-title small{font-size:11px;color:#929aad}
.tree-outline-scroll{height:min(72vh,800px);min-height:380px;overflow-y:auto;overflow-x:hidden;padding:12px 12px 25px 13px;scrollbar-width:thin;scrollbar-color:#c9c7ec transparent}
.tree-outline-scroll::-webkit-scrollbar{width:8px}.tree-outline-scroll::-webkit-scrollbar-thumb{border-radius:8px;background:#ccc9ef}
.tree-bucket{margin:5px 0 8px;border:1px solid #eef0f6;border-radius:11px;overflow:hidden}
.tree-bucket>summary{list-style:none;cursor:pointer;background:#f6f7fc;color:#393e5c;padding:12px 12px 11px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;line-height:1.45}
.tree-bucket>summary::-webkit-details-marker,.tree-chapter>summary::-webkit-details-marker,.tree-part>summary::-webkit-details-marker,.tree-module>summary::-webkit-details-marker{display:none}
.tree-triangle{color:#9d9ab7;font-size:11px;display:inline-block;transform:rotate(0);transition:transform .16s}
details[open]>summary>.tree-triangle{transform:rotate(90deg)}
.tree-bucket .tcount,.tree-chapter .tcount,.tree-part .tcount,.tree-module .tcount{color:#9ca4b4;font-size:10px;flex-shrink:0;font-weight:700;margin-left:auto;white-space:nowrap}
.tree-bucket .tree-bucket-body{padding:3px 5px 8px 9px}
.tree-chapter{margin-top:4px;position:relative}
.tree-chapter>summary{list-style:none;cursor:pointer;display:flex;gap:7px;align-items:center;padding:9px 9px 9px 8px;border-radius:8px;font-size:12px;font-weight:780;color:#525d75}
.tree-chapter>summary:hover,.tree-part>summary:hover,.tree-module>summary:hover{background:#f7f7ff}
.tree-chapter>summary .cno{color:#7975dc;font-weight:850;min-width:26px}
.tree-subtree{margin-left:16px;border-left:1px dashed #d9ddec;padding-left:11px;margin-bottom:4px}
.tree-part{margin:5px 0 5px}
.tree-part>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:7px;padding:8px 7px;font-size:11.5px;color:#626d83;font-weight:800}
.tree-modules{border-left:1px dashed #e2e5ef;margin-left:9px;padding-left:11px}
.tree-module{margin:4px 0}
.tree-module>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:7px;font-size:11.5px;color:#536585;font-weight:740}
.tree-module>summary .mini-pin{color:#6b66d6}
.tree-leaves{border-left:1px solid #e3e5f3;margin-left:9px;padding:3px 0 5px 12px}
.tree-leaf{width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding:8px 7px;margin:1px 0;border:0;border-radius:7px;background:transparent;color:#5e677d;line-height:1.45;font-size:11.5px}
.tree-leaf:hover{background:#f4f4ff;color:#3a3cb2}
.tree-leaf.chosen{background:#eeedff;color:#4e48b8;font-weight:800}
.tree-leaf .tnum{min-width:23px;flex-shrink:0;font-size:10px;font-weight:850;color:#908ac9}
.tree-leaf .tname{flex:1;overflow-wrap:anywhere}
.tree-leaf .tpill{flex-shrink:0;border-radius:5px;padding:0 4px;font-size:9px;background:#fff0ed;color:#bf654c;font-weight:750}
.tree-leaf .tpill.key{background:#f0edff;color:#7d65c5}
.tree-leaf .tpill.extra{background:#f1f4f7;color:#9299a6}
.tree-outline .selected-head{background:#f0efff!important;color:#4d49b5!important}
.tree-detail{min-width:0;border:1px solid #e4e8f0;background:#fff;border-radius:17px;box-shadow:var(--shadow);min-height:560px;overflow:hidden}
.tree-detail .detail-top{padding:23px 27px 21px;border-bottom:1px solid #edf0f5;background:linear-gradient(145deg,#fff 47%,#f9f9ff)}
.tree-detail .tree-path{font-size:11px;line-height:1.85;color:#8f96aa;margin-bottom:13px;overflow-wrap:anywhere}
.tree-detail .tree-path b{color:#7772d8}.tree-detail h3{font-size:21px;font-weight:850;letter-spacing:-.5px;line-height:1.44;margin:4px 0 10px}
.tree-detail .detail-kicker{font-size:10px;font-weight:850;color:#7773ca;letter-spacing:.12em}
.tree-detail .desc{font-size:12.5px;color:#758096;line-height:1.85;margin:5px 0 0}
.tree-detail .detail-body{padding:24px 27px 28px}
.tree-detail .tree-memory{background:#f6f5ff;border-left:3px solid #7772de;border-radius:0 10px 10px 0;padding:14px 17px;font-size:12px;color:#67669d;line-height:1.85}
.tree-memory b{color:#5654b9}.tree-memory p{margin:4px 0 0}
.tree-detail .detail-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 12px}
.tree-detail .detail-section-head h4{font-size:14px;margin:0}
.tree-detail .meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

function examMatches(q,focus){const m=q.examInfo||{};switch(focus){case 'case':return !!m.case;case 'essay':return !!m.essay;case 'both':return !!m.case&&!!m.essay;case 'both_direct':return !!m.essay&&(m.refs||[]).some(x=>x.exam==='case'&&(x.kind==='2025案例回忆题解析'||x.kind==='案例课堂例题'));case 'p1':return m.priority===1;case 'p12':return m.priority<=2;case 'none':return !m.case&&!m.essay;default:return true;}}
const EXAM_FILTER_OPTIONS=[['all','全部考点'],['p1','优先 P1 · 先背'],['p12','优先 P1～P2'],['both_direct','双科明确对应（先练）'],['both','两科交叉（含找错清单）'],['case','案例相关'],['essay','论文相关'],['none','未找到对应依据']];
function examBadge(q,compact=false){const m=q.examInfo||{priority:4};let z=`<span class="exam-tag priority-${m.priority}" title="复习优先级，按已核对课件而非实际命题概率">P${m.priority}</span>`;if(m.case)z+=`<span class="exam-tag exam-case">案例</span>`;if(m.essay)z+=`<span class="exam-tag exam-essay">论文</span>`;return `<span class="exam-badges ${compact?'compact':''}">${z}</span>`;}
function examPanel(q){const m=q.examInfo||{refs:[],priority:4};const a=m.refs||[];

function dashboard(){const lc=DATA.lite;const a=lc.filter(reviewed),master=lc.filter(mastered),due=lc.filter(isDue);const extraCount=extra.length;return header('180 条打主线，300 条补盲区。','学习驾驶舱',`<button class="btn primary" data-action="start-lite">开始背诵 <span aria-hidden="true">→</span></button>`)+`<p class="subhead" style="margin-top:-14px;margin-bottom:23px">以老师最新精简版为主；完整保留原题答案、原口诀和完整版对应题号。背诵记录自动保存在当前浏览器。</p><div class="exam-dashboard-bar"><div><strong>🎯 案例 &amp; 论文定向冲刺</strong><small>老师课件逐题对照：P1 先背、P2 次优先；两科交叉优先，不等于押题</small></div><button class="btn smol" data-action="exam-p1">先背 P1</button><button class="btn smol" data-action="exam-both">双科明确</button><button class="btn smol" data-action="exam-map">查看来源知识树 →</button></div><div class="stats"><div class="stat"><div class="label">精简主线</div><strong>180</strong><div class="extra">20 个章节 · 优先完成</div></div><div class="stat"><div class="label">已练习</div><strong>${a.length}<span style="font-size:17px;color:#a2a9b7"> / 180</span></strong><div class="extra">含“不会、模糊、会背”记录</div></div><div class="stat"><div class="label">已掌握</div><strong>${master.length}</strong><div class="extra">正确回忆后自己确认</div></div><div class="stat"><div class="label">待重练 / 到期</div><strong>${due.length}</strong><div class="extra">根据自己的标记提醒</div></div></div><div class="section-head"><h3>今天怎么背？</h3><span>不强制安排每天学哪章，按个人状态选择</span></div><div class="dashboard-grid"><div class="focus"><div class="eyebrow">RECOMMENDED PATH</div><div class="title">先会背框架，再记细节</div><p>先背精简 180 中的 <b>必须背 / 重点背</b>，逐项口述；做不到就标“不会”或“模糊”。主线较稳后，进入完整版的 106 条补充题。</p><div class="tiny-pills"><span class="pill must">必须背</span><span class="pill key">重点背</span><span class="pill matched">先提示再默写</span></div><div style="margin-top:19px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn smol" data-nav="tree">先看详细知识架构</button><button class="btn primary smol" data-action="start-core">练必背 / 重点背</button><button class="btn smol" data-action="start-due">重练不会题</button></div></div><div class="next-step panel"><h4>两版到底是什么关系？</h4><p>精简版有题目合并，不可简单按“300－180”判断遗漏。这里按照知识点建立题号对应。</p><div class="roadline"><div class="road"><b>180 条</b><small>精简核心题</small></div><div class="arrow">→</div><div class="road"><b>194 条</b><small>对应完整版原题</small></div><div class="arrow">+</div><div class="road"><b>${extraCount} 条</b><small>完整版额外补充</small></div></div><div style="margin-top:20px"><button class="btn smol" data-nav="compare">查看对照表 →</button></div></div></div><div class="section-head"><h3>按章节进入</h3><span>每章精简题数 + 掌握进度</span></div><div class="chap-grid">${CHAPTERS.map(o=>{const arr=lc.filter(q=>q.c===o.c),m=arr.filter(mastered).length;return `<button class="chap-tile" data-go-chap="${o.c}"><span class="no">CHAPTER ${String(o.c).padStart(2,'0')}</span><h4>${esc(o.name)}</h4><div class="meta"><span>精简 ${arr.length} 条 · 补充 ${extra.filter(x=>x.c===o.c).length} 条</span><span>${m}/${arr.length} 已掌握</span></div><div class="progress"><span style="width:${Math.round(m/arr.length*100)}%"></span></div></button>`}).join('')}</div><p class="muted" style="font-size:11px;margin-top:18px">提示：老师原版标注“必须背 / 重点背 / 尽量背”作为考试备考要求。新版记忆线索仅为辅助记忆，最终作答以展开后的知识点为准。</p>`}
function rebuildQueue(preferId){queue=filterItems(false);if(state.order==='random'){for(let j=queue.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[queue[j],queue[k]]=[queue[k],queue[j]]}}idx=preferId?Math.max(0,queue.findIndex(q=>q.id===preferId)):0;revealed=false;written=''}
function answerHtml(q){let n=0;return `<div class="ans-items">${q.blocks.map(b=>{if(b.type==='section')return `<div class="ans-section">${esc(b.text)}</div>`;if(b.type==='note')return `<div class="ans-note">${esc(b.text)}</div>`;n++;return `<div class="answer-item"><span class="num">${n}</span><span class="body">${esc(b.text)}</span></div>`}).join('')}</div>`}
function originalHtml(q){if(!q.originalHints?.length)return '<p class="muted" style="font-size:12px">老师这一题未提供独立口诀。</p>';return `<details class="orig-hint"><summary>查看老师原速记（${q.originalHints.length} 组）</summary>${q.originalHints.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`}
function trainer(){if(!queue.length)rebuildQueue();const q=queue[idx];let tool=toolbar(false),ss=niceStatus();if(!q)return header('抽背训练','FLASHCARD PRACTICE')+tool+`<div class="empty">当前筛选条件下没有题目。<div style="margin-top:17px"><button class="btn" data-action="clear-filter">重置筛选</button></div></div>`;
const origMap=q.v==='lite'?q.fullIds.map(id=>FULL.get(id)).filter(Boolean):q.liteIds.map(id=>LITE.get(id)).filter(Boolean);
const cuePart=state.showCue?`<div class="cue-box"><div class="lead">${q.curated?'🧠 理解式速记 · 重编':'🧩 关键词分组 · 辅助记忆'}</div><p>${esc(q.cue)}</p></div>`:`<div class="cue-box" style="background:#fafaff"><div class="lead">无提示模式</div><p>先独立口述，再打开答案。</p></div>`;
return header('用“提问 → 回忆 → 核对”代替死记。','背诵训练')+tool+`<div class="summary-strip">当前范围 <strong>${queue.length} 题</strong> · <span>顺序：${state.order==='random'?'随机':'原始题号'}</span> · ${q.v==='lite'?'先练精简180，再补完整版':'本题来自完整版'} · <label style="margin-left:auto"><input type="checkbox" id="toggle-cue" ${state.showCue?'checked':''}/> 显示新记忆线索</label></div><div class="training-layout"><div class="panel trainbox"><div class="train-header"><div class="train-top-line"><span>${formatNo(q)} · PDF 第${q.page}页</span><span>第 ${idx+1} / ${queue.length} 题</span></div><div class="progress" style="height:4px;margin-top:13px"><span style="width:${((idx+1)/queue.length*100).toFixed(2)}%"></span></div><h3>${esc(q.title)}</h3><div class="tagline">${pill(q.level)}${examBadge(q)}${q.marks.map(x=>`<span class="pill matched">${esc(x)}</span>`).join('')}<span class="pill">${statusDot(q.id)} ${statusLabel(q.id)}</span>${q.v==='lite'?`<span class="pill">完整版 Q${origMap.map(x=>x.n).join('、Q')||'—'}</span>`:origMap.length?`<span class="pill matched">已纳入精简180</span>`:`<span class="pill extra">完整版补充题</span>`}</div></div><div class="train-body">${examPanel(q)}${cuePart}<div class="write-area"><label for="recall">先口述，或在这里默写关键词（内容不会上传）</label><textarea id="recall" placeholder="不必逐字完全一致，试着写全所有要点…">${esc(written)}</textarea></div>${revealed?`<div class="answer-section"><div class="answer-title"><h4>完整答案 · 逐项核对</h4><span class="muted" style="font-size:11px">请检查是否漏点，而非只看像不像口诀</span></div>${answerHtml(q)}${originalHtml(q)}</div>`:`<div class="blank-zone"><div style="font-size:28px;color:var(--accent)">✦</div><h4>答案已隐藏</h4><p>先自己回忆，再核对 ${q.blocks.filter(b=>b.type==='item').length} 个知识要点</p><button class="btn primary" data-action="reveal">展开完整答案（空格）</button></div>`}</div><div class="train-footer"><div class="footer-controls"><button class="btn smol" data-action="prev">← 上一题</button><button class="btn smol" data-action="next">下一题 →</button><button class="btn smol" data-action="shuffle-now">随机一题</button></div>${revealed?`<div class="score-group"><button class="btn bad smol" data-rate="1">不会 · 重练</button><button class="btn warning smol" data-rate="2">模糊 · 明天复习</button><button class="btn good smol" data-rate="3">会背 · 3天后复习</button></div>`:`<span class="muted" style="font-size:12px;align-self:center">展开答案后可标记掌握程度</span>`}</div></div><div class="hide-mobile"><div class="training-guide panel"><h4>一次有效背诵只需三步</h4><div class="guide-step"><span class="i">1</span><p><b>观察题目</b>，尝试按线索还原思路。</p></div><div class="guide-step"><span class="i">2</span><p><b>独立口述</b>，长题先记分类，再补完整表达。</p></div><div class="guide-step"><span class="i">3</span><p><b>核对漏项</b>，将自己真实掌握情况标为不会、模糊或会背。</p></div><div style="border-top:1px solid var(--line);margin:16px 0;padding-top:13px;color:#969caf;font-size:11px;line-height:2">快捷键：空格=展开答案　←/→=翻题<br>数字 1 / 2 / 3 = 标记掌握度</div><label style="font-size:11px;color:#8b90a6"><input type="checkbox" id="toggle-auto" ${state.autoNext?'checked':''}> 标记后自动下一题</label></div><div class="queue-card panel"><div style="font-weight:700;font-size:12px;margin-bottom:6px">原始题号映射</div><p class="muted" style="margin:0 0 8px;font-size:12px">${q.v==='lite'?'这道精简题对应的完整版题目：':'这道完整版题是否被精简保留：'}</p><div class="mini-links">${origMap.length?origMap.map(x=>`<button data-jump="${x.id}">第${x.c}章 Q${x.n}</button>`).join(''):`<span style="font-size:12px;color:#a2a7b5">未纳入精简版，属补充范围</span>`}</div></div></div></div>`}
function choosePage(bank='lite',level='all',status='all',chapter='all'){state.bank=bank;state.level=level;state.filterStatus=status;state.chapter=chapter;state.view='trainer';persist();rebuildQueue();render(true)}
function library(){let list=filterItems();let title=header('按章节查看完整知识点','知识总览',`<button class="btn" data-action="export">导出背诵记录</button>`);let grp=Object.groupBy?Object.groupBy(list,x=>x.c):list.reduce((a,x)=>(a[x.c]??=[]).push(x),{});let body=Object.entries(grp).map(([ch,arr])=>`<div class="list-group"><h3>第 ${ch} 章 · ${esc(CHAPTERS.find(x=>x.c==ch)?.name||'')} <span class="muted" style="font-size:12px">${arr.length} 道</span></h3><div class="list-grid">${arr.map(q=>`<details class="entry" id="row-${q.id}" ${listOpen.has(q.id)?'open':''}><summary><span class="qid">Q${q.n} ${statusDot(q.id)}</span><span class="title">${esc(q.title)}</span>${pill(q.level)}${examBadge(q,true)}<span class="chev">▸</span></summary><div class="detail">${examPanel(q)}<div class="subtip"><b>${q.curated?'理解式速记':'关键词分组'}：</b>${esc(q.cue)}</div>${answerHtml(q)}${originalHtml(q)}<div class="entry-foot"><span class="meta-small">${formatNo(q)} · 源PDF第${q.page}页${q.v==='lite'?' · 对应完整版 '+q.fullIds.map(x=>'Q'+FULL.get(x).n).join(' / '):''}</span><button class="btn smol" data-jump="${q.id}">抽背这道题 →</button></div></div></details>`).join('')}</div></div>`).join('');return title+toolbar(true)+`<div class="summary-strip">检索结果：<strong>${list.length} 题</strong> · 答案默认折叠，点击标题展开 · 完整原文要点保留</div>`+(body||`<div class="empty">没有匹配的知识点，请换个关键词或清除筛选。</div>`)}
function compare(){const query=state.search.trim().toLowerCase();let list=DATA.lite.filter(x=>state.chapter==='all'||x.c==state.chapter).filter(x=>!query||(x.title+x.c+x.n).toLowerCase().includes(query));const mapped=DATA.full.length-extra.length;return header('180 条与 300 条，逐题有据可查。','版本对照')+`<div class="dashboard-grid"><div class="panel panel-pad"><h3 style="margin-top:0;font-size:16px">对应关系</h3><p style="color:var(--muted);margin-bottom:0">180 条精简题，对应完整版 <b style="color:var(--ink)">${mapped} 条原题</b>，其中 ${DATA.lite.filter(q=>q.fullIds.length>1).length} 条精简题合并了完整版的两道题。</p></div><div class="panel panel-pad"><h3 style="margin-top:0;font-size:16px">没有单独纳入精简版</h3><p style="color:var(--muted);margin-bottom:0">完整版另有 <b style="color:var(--ink)">${extra.length} 条</b>补充题，可用“完整版额外”题库集中练习。</p></div></div><div class="toolbar panel" style="margin-top:20px"><div class="field"><label>筛选章节</label>${selectHtml('filter-chapter',[['all','全部章节'],...CHAPTERS.map(x=>[String(x.c),`第${x.c}章 ${x.name}`])],state.chapter)}</div><div class="field search-field"><label>搜索精简题</label><input class="search" id="filter-search" placeholder="输入关键词快速定位" value="${esc(state.search)}"/></div><button class="btn smol" data-action="start-extra" style="align-self:flex-end">去背 ${extra.length} 条补充题 →</button></div><div class="section-head"><h3>精简题 → 完整版题号</h3><span>${list.length} 条</span></div>${list.map(q=>`<div class="compare-row"><div class="compare-h"><span class="qnum">精简 Q${q.n}</span><span class="ctitle">${esc(q.title)}</span>${q.fullIds.length>1?`<span class="pill matched">合并题</span>`:''}</div><div class="maptext">第 ${q.c} 章 · 对应完整版 ${q.fullIds.map(fid=>{const f=FULL.get(fid);return `<a href="#" data-jump="${fid}">Q${f.n} ${esc(f.title)}</a>`}).join('')}</div></div>`).join('')||`<div class="empty">没有匹配条目。</div>`}<div class="section-head"><h3>完整版补充题</h3><span>${extra.length} 条 · 不在精简主线内单独出现</span></div><div class="panel panel-pad"><div class="mini-links" style="gap:8px">${extra.filter(q=>state.chapter==='all'||state.chapter==q.c).map(x=>`<button data-jump="${x.id}" title="${esc(x.title)}">${x.c}-${x.n} ${esc(x.title.length>18?x.title.slice(0,18)+'…':x.title)}</button>`).join('')}</div></div>`}
function render(scroll=false){navRender();$('#breadcrumb').textContent=navs.find(x=>x[0]===state.view)?.[2]||'学习驾驶舱';root(state.view==='dashboard'?dashboard():state.view==='tree'?treeDashboard():state.view==='trainer'?trainer():state.view==='library'?library():compare());if(scroll)window.scrollTo({top:0,behavior:'smooth'});}
function toast(msg){const x=$('#toast');x.textContent=msg;x.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('visible'),2300)}
function next(delta){if(!queue.length)return;idx=(idx+delta+queue.length)%queue.length;revealed=false;written='';render();window.scrollTo({top:70,behavior:'smooth'})}
function jump(id){const q=FULL.get(id)||LITE.get(id);if(!q)return;state.bank=q.v==='lite'?'lite':'full';state.chapter='all';state.level='all';state.filterStatus='all';state.examFocus='all';examFocus='all';state.view='trainer';persist();rebuildQueue(id);render(true)}
function rate(n){const q=queue[idx];if(!q)return;const old=prog(q.id);const day=86400000;const d=n===1?0:n===2?1:old.streak>=2?7:3;state.progress[q.id]={status:n,reviewAt:now()+d*day,streak:n===3?(old.streak||0)+1:0,updatedAt:now()};persist();toast(`${formatNo(q)}：已标记“${statusLabel(q.id)}”`);if(state.autoNext)next(1);else render()}
function exportData(){const data={exportedAt:new Date().toISOString(),version:1,progress:state.progress};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`系规背诵进度_${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已导出本地进度文件')}
function handleAction(action){if(action==='start-lite')choosePage('lite');else if(action==='start-core')choosePage('lite','必须背');else if(action==='start-due')choosePage('lite','all','due');else if(action==='start-extra')choosePage('extra');else if(action==='clear-filter'){state.chapter='all';state.level='all';state.filterStatus='all';state.search='';persist();rebuildQueue();render()}else if(action==='reveal'){revealed=true;render()}else if(action==='next')next(1);else if(action==='prev')next(-1);else if(action==='shuffle-now'){if(queue.length){idx=Math.floor(Math.random()*queue.length);revealed=false;written='';render()}}else if(action==='export')exportData()}
// Input listeners: never rerender while the user types in a textarea/search box.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){state.view=nav.dataset.nav;state.search='';persist();if(state.view==='trainer')rebuildQueue();render(true);return}
const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return}
const chap=e.target.closest('[data-chap]');if(chap){state.chapter=chap.dataset.chap;state.view='trainer';state.bank='lite';state.level='all';state.filterStatus='all';persist();rebuildQueue();render(true);return}
const go=e.target.closest('[data-go-chap]');if(go){choosePage('lite','all','all',go.dataset.goChap);return}
const goto=e.target.closest('[data-jump]');if(goto){e.preventDefault();jump(goto.dataset.jump);return}
const treeChoice=e.target.closest('[data-tree-select]');if(treeChoice){e.preventDefault();treeSelect(treeChoice.dataset.treeSelect);return}
const treeAct=e.target.closest('[data-tree-action]');if(treeAct){treeDoAction(treeAct.dataset.treeAction);return}
const examQuick=e.target.closest('[data-action^="exam-"]');if(examQuick){const ac=examQuick.dataset.action;state.examFocus=ac==='exam-both'?'both_direct':'p1';examFocus=state.examFocus;state.bank='lite';treeBank='lite';state.treeBank='lite';state.view=ac==='exam-map'?'tree':'trainer';treeSel='chapter:4';persist();rebuildQueue();render(true);return;}
const b=e.target.closest('[data-rate]');if(b){rate(+b.dataset.rate);return}
});
document.addEventListener('change',e=>{if(e.target.id==='tree-bank'){treeBank=e.target.value;state.treeBank=treeBank;treeSel='chapter:4';persist();render();return}if(e.target.id==='tree-level'){treeLevel=e.target.value;state.treeLevel=treeLevel;persist();render();return}if(e.target.id==='tree-exam'){examFocus=e.target.value;state.examFocus=examFocus;persist();render();return}});
document.addEventListener('toggle',e=>{if(e.target.dataset?.treeNode){if(e.target.open)treeOpen.add(e.target.dataset.treeNode);else treeOpen.delete(e.target.dataset.treeNode)}},true);
document.addEventListener('input',e=>{if(e.target.id!=='tree-search')return;treeSearch=e.target.value;const st=e.target.selectionStart;const en=e.target.selectionEnd;const sc=$('#tree-scroll')?.scrollTop||0;render();const x=$('#tree-search');if(x){x.focus();x.setSelectionRange(st,en)}if($('#tree-scroll'))$('#tree-scroll').scrollTop=sc;});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='filter-bank'){state.bank=e.target.value;state.chapter='all'}else if(id==='filter-chapter')state.chapter=e.target.value;else if(id==='filter-level')state.level=e.target.value;else if(id==='filter-status')state.filterStatus=e.target.value;else if(id==='filter-exam'){state.examFocus=e.target.value;examFocus=e.target.value;}else if(id==='filter-order')state.order=e.target.value;else if(id==='toggle-cue')state.showCue=e.target.checked;else if(id==='toggle-auto')state.autoNext=e.target.checked;else return;persist();if(state.view==='trainer'&&id!=='toggle-cue'&&id!=='toggle-auto')rebuildQueue();render();});
document.addEventListener('input',e=>{if(e.target.id==='recall'){written=e.target.value;return}if(e.target.id==='filter-search'){state.search=e.target.value;const selStart=e.target.selectionStart,selEnd=e.target.selectionEnd;const hadFocus=true;persist();render();const newInput=$('#filter-search');if(newInput){newInput.focus();newInput.setSelectionRange(selStart,selEnd)}return}});
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('entry')){if(e.target.open)listOpen.add(e.target.id.slice(4));else listOpen.delete(e.target.id.slice(4))}},true);
document.addEventListener('keydown',e=>{if(state.view!=='trainer')return;const t=e.target;if(['INPUT','TEXTAREA','SELECT'].includes(t.tagName)||t.isContentEditable)return;if(e.key===' '){e.preventDefault();revealed=!revealed;render()}else if(e.key==='ArrowRight'){e.preventDefault();next(1)}else if(e.key==='ArrowLeft'){e.preventDefault();next(-1)}else if(revealed&&['1','2','3'].includes(e.key)){rate(+e.key)}});
if(!['dashboard','tree','trainer','library','compare'].includes(state.view))state.view='dashboard';
render();
</script>
</body></html>
