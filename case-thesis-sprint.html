function quiz(){if(!state.queue.length)return `<div class="topic-lead"><h2>随机抽背</h2><p>选一个题库开始，系统只显示题目；先回忆，再揭晓标准答案。</p><div class="buttonrow"><button class="btn primary" onclick="startQuiz('push')">随机练 111 道押题</button><button class="btn" onclick="startQuiz('weakpush')">不会题／未背重练</button><button class="btn" onclick="startQuiz('full')">随机练理论 300 条</button></div></div>${footer()}`;
 let item=state.queue[state.quizIndex];let q=item.startsWith('q:')?QMAP.get(item.slice(2)):FMAP.get(item.slice(2));if(!q)return `<div class="empty">这道题目暂时无法加载。<button onclick="startQuiz('push')">重新开始</button></div>`;
 let ans=q.id.startsWith('full-')?fmtFull(q):q.refs.map(id=>FMAP.get(id)).filter(Boolean).map(fmtFull).join('')+(q.extra.length?fmtExtra(q):'');let current=state.quizIndex+1;
 return `<div class="quiz"><div class="topic-lead"><h2>遮挡默背 · 先说关键字再展开</h2><p>可直接记为“不会 / 模糊 / 会背”。跨两份资料的题目会自动关联答案，答题时以考点原文的完整要求为准。</p><div class="buttonrow"><button class="btn tiny" onclick="startQuiz('push')">换成押题 111</button><button class="btn tiny" onclick="startQuiz('full')">换成理论 300</button><button class="btn tiny" onclick="startQuiz('weakpush')">重练不会题</button></div></div><div class="quiz-top"><b>${current} / ${state.queue.length}</b><div class="progress" style="flex:1;margin:0 17px"><div style="width:${Math.round(current/state.queue.length*100)}%"></div></div>${pTag(q)}</div><div class="quiz-question"><div class="flex">${q.id.startsWith('full-')?tag('理论 300｜第'+q.c+'章 问'+q.n,'blue'):tag('押题｜考点'+q.t+' · '+q.n,'primary')}${q.years?.length?tag(q.years.join('/')+' 资料标注','dim'):''}</div><h2>${e(q.title)}</h2>${state.quizShow?`<div class="answer-wrap"><h4>参考答案</h4>${ans}</div>`:'<div class="quiz-hidden"><span>答案已遮挡<br>请先自己默写要点，再点击「揭晓答案」</span></div>'}<div class="buttonrow" style="margin-top:19px"><button class="btn primary" onclick="state.quizShow=!state.quizShow;save();render()">${state.quizShow?'遮挡答案':'揭晓答案'}</button><button class="btn" onclick="quizNext(-1)" ${state.quizIndex===0?'disabled':''}>上一题</button><button class="btn" onclick="quizNext(1)">${current===state.queue.length?'完成一轮 ↗':'下一题 →'}</button></div>${state.quizShow?statusButtons(item):'<div class="micro" style="margin-top:11px">展开答案后可标记掌握程度</div>'}</div></div>${footer()}`}
function quizNext(d){if(state.quizIndex+d>=state.queue.length){state.queue=[];state.quizIndex=0;state.quizShow=false}else state.quizIndex=Math.max(0,state.quizIndex+d);save();render();window.scrollTo({top:0,behavior:'instant'})}
function source(){return `<div class="topic-lead"><div class="flex">${tag('原始材料索引','primary')}${tag('离线 29 页完整保留','blue')}</div><h2>押题资料原文核对</h2><p>第二份 PDF 为整页扫描图，页面中的复杂表格、示例、公式和找错框架均以原页为准；点击页码可放大阅读、翻页。</p><div class="notice">资料 ①《3【系规案例论文】理论必背知识点最新2026年版.pdf》：39 页，300 条理论知识，已转为逐题答案卡。<br>资料 ②《26年系规案例最后押题资料(1).pdf》：29 页，13 个押题专题，完整页面离线内置。<br>注意：页面文字为学习整理；原材料中“真题年份”和“考查可能性”保留其原意，不代表官方预测或独立核验。题目及表格发生理解分歧时，以原 PDF 页面为准。</div></div><div class="section-head"><h2>快速跳到专题原页</h2></div><div class="buttonrow" style="margin-bottom:18px">${TOP.map(t=>`<button class="btn tiny" onclick="openPage(${t.start})">${t.id}. ${e(t.name)}</button>`).join('')}</div>${headTitle('全 29 页原文','点击缩略图打开阅读器')}<div class="pagegrid">${PAGE_IMAGES.map((x,i)=>`<button class="pagebtn" onclick="openPage(${i+1})"><img loading="lazy" alt="原始押题第${i+1}页" src="${x}"><span>第 ${i+1} 页 ${PAGES[i+1]?e(PAGES[i+1]):''}</span></button>`).join('')}</div>${footer()}`}
function openPage(p){pageNum=Math.min(29,Math.max(1,p));pageZoom=1;document.getElementById('modal').classList.add('show');syncPage()}
function goSourceText(p){alert('对应理论 300 条原版 PDF 的第 '+p+' 页。当前网页已保存该题目原始答案及来源页码；请在上传的第一份 PDF 中查看版式原文。')}
function syncPage(){document.getElementById('modalName').textContent='押题原始资料 · 第 '+pageNum+' / 29 页';let img=document.getElementById('pageImage');img.src=PAGE_IMAGES[pageNum-1];img.style.width=Math.round(850*pageZoom)+'px';document.getElementById('modalScroll').scrollTop=0}
function movePage(delta){pageNum=Math.min(29,Math.max(1,pageNum+delta));syncPage()}
function changeZoom(delta){pageZoom=Math.max(.5,Math.min(2.6,Math.round((pageZoom+delta)*10)/10));syncPage()}
function closePage(){document.getElementById('modal').classList.remove('show')}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePage();if(document.getElementById('modal').classList.contains('show')){if(ev.key==='ArrowLeft')movePage(-1);if(ev.key==='ArrowRight')movePage(1)}});
function footer(){return `<div class="footer">2026 · 系统规划与管理师 · 案例 / 论文冲刺背诵库<br>仅作课程资料整理与学习辅助 · 本地离线 · 不上传背诵进度</div>`}
render();
</script></body></html>
