function getStatus(id){return grades[id]||''}

function yearTags(q){return q.years.map(y=>'<span class="pill year" title="原资料标注的年份，未经官方真题逐一核验">资料标注 '+escapeHtml(y)+'</span>').join('')}

function updateTop(){const c=counts();$('topProgress').textContent='已掌握 '+c.good+' / 111';$('topTitle').textContent=state.route==='quiz'?'随机抽背':state.route==='pages'?'原文核对':'2026 系规案例 · 押题冲刺'}

 $('topicsNav').innerHTML=T.map(t=>'<button class="sidebtn '+(state.route==='topics'&&state.topic===t.id?'active':'')+'" data-topic="'+t.id+'"><span class="num">'+String(t.id).padStart(2,'0')+'</span><span class="nam">'+escapeHtml(t.name)+'</span><span class="st">'+'★'.repeat(t.stars)+'</span></button>').join('');
 for(const v of ['topics','quiz','pages'])$('nav'+v).classList.toggle('active',state.route===v);
 }

function renderTopBanner(){const c=counts();return `<section class="hero"><div class="eyebrow">2026 · 13 TOPICS · OFFLINE</div><h1>案例最后押题｜独立背诵版</h1><p>只围绕这份《26年系规案例最后押题资料》整理：13 个专题、111 道题。按老师的专题顺序复习，默写答案、分析找错、公式计算与原 PDF 表格都能一处查看。</p><div class="chiprow"><span>13 个专题</span><span>111 道押题</span><span>29 页原文可核对</span><span>按专题星级备考</span></div></section><div class="stats"><div class="metric"><b>111</b><small>原件押题问题</small></div><div class="metric"><b>${Q.filter(q=>q.years.length).length}</b><small>带资料年份标记的题</small></div><div class="metric"><b>${c.done}</b><small>已经自评过的题目</small></div><div class="metric"><b>${c.good}</b><small>已标记「会背」</small></div></div>`}
function qMatches(q){if(state.filter==='year'&&!q.years.length)return false;if(state.filter==='calc'&&q.type!=='公式计算')return false;if(state.filter==='problem'&&q.type!=='找错分析')return false;if(state.filter==='write'&&q.type!=='默写')return false;if(state.filter==='unknown'&&getStatus(q.id)!=='bad')return false;if(state.filter==='pending'&&getStatus(q.id)==='good')return false;if(state.onlyYear&&!q.years.length)return false;const s=state.search.trim().toLowerCase();if(s){const ans=[...(q.answers||[]).flatMap(x=>x.items||[]),...(q.supplement?.items||[])].join(' ');return [q.title,TOPIC_BY_ID[q.t].name,ans, q.years.join(' ')].join(' ').toLowerCase().includes(s)}return q.t===state.topic}
function renderTopics(){const topic=TOPIC_BY_ID[state.topic];const shown=Q.filter(qMatches);
 return renderTopBanner()+`<div class="sectionline"><h2>专题复习</h2><div class="btn-group"><button class="btn tiny soft" data-action="allanswers">展开当前答案</button><button class="btn tiny" data-action="hideanswers">遮挡全部答案</button><button class="btn tiny" data-action="gotoquiz">按本专题抽背</button></div></div>
 <div class="filterbar"><input id="searchInput" placeholder="搜索题目、答案关键词（可跨专题）" value="${escapeHtml(state.search)}" aria-label="搜索题目"><select id="kindFilter" aria-label="筛选题型"><option value="all" ${state.filter==='all'?'selected':''}>全部题型</option><option value="write" ${state.filter==='write'?'selected':''}>纯默写</option><option value="problem" ${state.filter==='problem'?'selected':''}>找错分析</option><option value="calc" ${state.filter==='calc'?'selected':''}>公式计算</option><option value="year" ${state.filter==='year'?'selected':''}>有年份标记</option><option value="unknown" ${state.filter==='unknown'?'selected':''}>不会题</option><option value="pending" ${state.filter==='pending'?'selected':''}>未掌握</option></select><button class="btn tiny" data-action="clearFilter">清除筛选</button></div>
 <div class="topicHead"><div class="headingline"><div><div class="kicker">TOPIC ${String(topic.id).padStart(2,'0')} · 第 ${topic.chapter} 章</div><h2>${escapeHtml(topic.name)}</h2><div class="detail">${escapeHtml(topic.note)}</div></div><div>${stars(topic.stars)}</div></div><div class="sourceLine">本专题 ${topic.count} 道题 · 原资料第 ${topic.start}～${topic.end} 页　<button class="btn tiny" data-page="${topic.start}">核对专题原文 ↗</button></div></div>
 <div class="sectionline"><h2 style="font-size:16px">${state.search.trim()?'搜索结果':'当前专题题目'} <span class="small">（${shown.length}）</span></h2><span class="small">点击题目展开答案，旁边可查看 PDF 原页</span></div>
 <div id="cards">${shown.map(renderQuestion).join('')||'<div class="empty">当前条件下没有匹配的题目，请切换专题或清除筛选。</div>'}</div>
 <div class="footnote">说明：题目顺序、专题星级、资料标注的年份来自本次 PDF。文字答案按原文件的知识要点整理；部分长表格以原页为准。老师的星级和年份标签属于资料陈述，不等同于官方对未来命题的预测。</div>`
}
function renderAnswer(q){let a='';if(q.sourceIncomplete)a+='<div class="warnbox">本文件未附完整案例题干；本题只能复习四要素检查方向，不能把列出的方向当作某个具体案例的确定错误。</div>';
 if(!q.answers.length&&!q.supplement)a+='<div class="warnbox">本题参考答案须对照原 PDF 查阅，未自行编造缺失内容。</div>';
 for(const x of q.answers){a+=`<div class="answerblock"><h4>${escapeHtml(x.title)}</h4><ol>${x.items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ol></div>`}
 if(q.supplement){const x=q.supplement;a+=`<div class="answerblock analysisblock"><h4>${escapeHtml(x.heading)}</h4><ol>${x.items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ol><div class="explain">${escapeHtml(x.note)}</div></div>`}
 a+=`<div class="answer-actions"><button class="btn tiny soft" data-page="${q.sourcePage}">原文第 ${q.sourcePage} 页 ↗</button>${q.referencePages.filter(p=>p!==q.sourcePage).map(p=>`<button class="btn tiny" data-page="${p}">续页 ${p} ↗</button>`).join('')}<div class="status">${rateButtons(q)}</div></div>`;
 return a;
}
function rateButtons(q){return [['bad','不会'],['mid','模糊'],['good','会背']].map(([r,l])=>`<button data-rate="${r}" data-id="${q.id}" class="${getStatus(q.id)===r?'active':''}" title="记录背诵状态">${l}</button>`).join('')}
function renderQuestion(q){const show=state.revealed.has(q.id);return `<article class="question" id="q-${q.id}"><div class="qtop" role="button" tabindex="0" data-toggle="${q.id}" aria-expanded="${show?'true':'false'}"><span class="qid">${String(q.n).padStart(2,'0')}</span><div class="qmain"><div class="qtitle">${escapeHtml(q.title)}</div><div class="qmeta">${kindTag(q)}${yearTags(q)}${statusTag(q)}<span class="small">专题 ${q.t} · 原文 P${q.sourcePage}</span></div></div><span class="arrow">${show?'⌃':'⌄'}</span></div><div class="qbody" ${show?'':'hidden'}>${renderAnswer(q)}</div></article>`}
function renderPages(){return `<section class="hero"><div class="eyebrow">SOURCE · 29 PAGES</div><h1>原文核对</h1><p>扫描页已嵌入网页，不依赖外部链接。对照题号、表格、星级、计算公式和老师标注的年份；点击任意页可放大阅读。</p></section><div class="panel"><h2>选择原文页码</h2><div class="btn-group">${T.map(t=>`<button class="btn tiny" data-page="${t.start}">${String(t.id).padStart(2,'0')} ${escapeHtml(t.name)} · P${t.start}</button>`).join('')}</div><hr style="border:0;border-top:1px solid #e0eaf0;margin:20px 0"><div class="btn-group" style="margin-top:15px">${SOURCE.images.map((v,i)=>`<button data-page="${i+1}" class="btn tiny">${i+1}</button>`).join('')}</div><p class="small" style="margin-top:13px">原件共 29 页。可在原文阅读器中上一页、下一页及缩放。</p></div>`}
function baseForQuiz(){switch(state.quizScope){case 'topic':return Q.filter(q=>q.t===state.topic);case 'star5':return Q.filter(q=>TOPIC_BY_ID[q.t].stars===5);case 'bad':return Q.filter(q=>getStatus(q.id)==='bad');case 'notgood':return Q.filter(q=>getStatus(q.id)!=='good');case 'year':return Q.filter(q=>q.years.length);case 'calc':return Q.filter(q=>q.type==='公式计算');default:return Q}}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function nextQuiz(auto=false){state.quizAt++;state.quizShow=false;if(state.quizAt>=state.quizOrder.length){state.quizOrder=[];state.quizAt=0}render()}
function renderQuiz(){const options=[['all','全部 111 道'],['topic','当前专题'],['star5','★★★★★ 专题'],['year','带年份标记'],['calc','公式计算'],['bad','只练不会题'],['notgood','未掌握题']];const current=state.quizOrder.length?Q_BY_ID[state.quizOrder[state.quizAt]]:null;
return `<section class="hero"><div class="eyebrow">QUIZ · SELF TEST</div><h1>随机抽背</h1><p>先看题目、心里默写或写出要点，再显示答案核对。选择「不会／模糊／会背」后自动下一题；自评会保存在当前浏览器。</p></section><div class="panel"><h2>选择训练范围</h2><div class="btn-group"><select id="quizScope" class="btn" aria-label="抽背范围">${options.map(([k,v])=>`<option value="${k}" ${state.quizScope===k?'selected':''}>${v}（${(k===state.quizScope?baseForQuiz():k==='all'?Q:k==='topic'?Q.filter(q=>q.t===state.topic):k==='star5'?Q.filter(q=>TOPIC_BY_ID[q.t].stars===5):k==='year'?Q.filter(q=>q.years.length):k==='calc'?Q.filter(q=>q.type==='公式计算'):k==='bad'?Q.filter(q=>getStatus(q.id)==='bad'):Q.filter(q=>getStatus(q.id)!=='good')).length}）</option>`).join('')}</select><button class="btn primary" data-action="restartQuiz">${current?'重新洗牌':'开始抽背'}</button></div><p class="small">当前「本专题」指左侧选择的专题；手机可在菜单中切换。</p></div>
${current?`<div class="quiz-card"><div class="minirow"><span class="pill analysis">${escapeHtml(TOPIC_BY_ID[current.t].name)}</span>${kindTag(current)}${yearTags(current)}<span class="small" style="margin-left:auto">第 ${state.quizAt+1} / ${state.quizOrder.length} 题</span></div><div class="quiz-q">${escapeHtml(current.title)}</div><div class="progress"><div style="width:${100*(state.quizAt+1)/state.quizOrder.length}%"></div></div><div class="quiz-stats"><button class="btn ${state.quizShow?'':'primary'}" data-action="quizReveal">${state.quizShow?'隐藏答案':'显示答案'}</button><button class="btn" data-action="quizSkip">跳过本题 →</button><button class="btn tiny" data-page="${current.sourcePage}">原件第 ${current.sourcePage} 页</button></div>${state.quizShow?`<div class="quiz-answer">${renderAnswer(current)}</div>`:'<div class="reveal-note" style="margin-top:20px">答案暂时遮挡。试着按顺序说出每一条，再点击「显示答案」。</div>'}</div>`:`<div class="panel"><div class="callout">当前没有正在进行的抽背。选择范围后点击「开始抽背」。如果选的是「不会题」而数量为 0，请先在专题复习中标记几道不会的题。</div></div>`}`}
function modalOpen(page){state.viewerPage=Math.min(29,Math.max(1,Number(page)||1));state.zoom=1;$('modalback').classList.add('open');document.body.style.overflow='hidden';refreshImage()}
function modalClose(){$('modalback').classList.remove('open');document.body.style.overflow=''}
function refreshImage(){$('pageNumber').textContent=state.viewerPage;$('pageImg').src=SOURCE.images[state.viewerPage-1];$('pageImg').style.width=(100*state.zoom)+'%';$('prevPage').disabled=state.viewerPage===1;$('nextPage').disabled=state.viewerPage===29;$('viewscroll').scrollTop=0;$('viewscroll').scrollLeft=0}
function makePageStep(v){state.viewerPage=Math.min(29,Math.max(1,state.viewerPage+v));refreshImage()}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
 let el=e.target.closest('[data-topic]');if(el){viewTopic(Number(el.dataset.topic));$('side').classList.remove('open');return}
 el=e.target.closest('[data-route]');if(el){setRoute(el.dataset.route);$('side').classList.remove('open');return}
 el=e.target.closest('[data-page]');if(el){modalOpen(el.dataset.page);return}
 el=e.target.closest('[data-rate]');if(el){setRate(el.dataset.id,el.dataset.rate);return}
 el=e.target.closest('[data-toggle]');if(el){const id=el.dataset.toggle;state.revealed.has(id)?state.revealed.delete(id):state.revealed.add(id);visited[id]=true;persist();let qel=el.closest('.question');if(qel){qel.outerHTML=renderQuestion(Q_BY_ID[id]);}return}
 el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='allanswers'){for(const q of Q.filter(qMatches))state.revealed.add(q.id);render();}
 if(a==='hideanswers'){state.revealed.clear();render()}
 if(a==='clearFilter'){state.search='';state.filter='all';render()}
 if(a==='gotoquiz'){state.quizScope='topic';state.route='quiz';startQuiz()}
 if(a==='restartQuiz'){startQuiz()}
 if(a==='quizReveal'){state.quizShow=!state.quizShow;render()}
 if(a==='quizSkip'){nextQuiz()}
});
document.addEventListener('change',e=>{if(e.target.id==='kindFilter'){state.filter=e.target.value;render()}if(e.target.id==='quizScope'){state.quizScope=e.target.value;state.quizOrder=[];render()}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){let at=e.target.selectionStart;state.search=e.target.value;const cards=$('cards');if(cards)cards.innerHTML=Q.filter(qMatches).map(renderQuestion).join('')||'<div class="empty">没有检索到匹配考点。</div>';}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-toggle]')){e.preventDefault();e.target.click()}if(e.key==='Escape')modalClose();if(state.route==='quiz'&&state.quizOrder.length&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key===' '){e.preventDefault();state.quizShow=!state.quizShow;render()}if(state.quizShow&&['1','2','3'].includes(e.key)){setRate(state.quizOrder[state.quizAt],{1:'bad',2:'mid',3:'good'}[e.key])}}});
$('prevPage').onclick=()=>makePageStep(-1);$('nextPage').onclick=()=>makePageStep(1);$('closeModal').onclick=modalClose;$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))modalClose()});$('zoomIn').onclick=()=>{state.zoom=Math.min(3.5,state.zoom+.25);refreshImage()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.55,state.zoom-.25);refreshImage()};$('zoomReset').onclick=()=>{state.zoom=1;refreshImage()};$('menuToggle').onclick=()=>$('side').classList.toggle('open');
render();
</script>
</body>
</html>
